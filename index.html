<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏫</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>초등 학급 1인 1역 역할 관리 웹 앱</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800;900&family=Outfit:wght@500;700;800&display=swap" rel="stylesheet">
    <!-- 첫 페인트 전에 저장된 테마를 적용해 흰 화면 번쩍임을 막는다. -->
    <script>
      (function () {
        try {
          var p = JSON.parse(localStorage.getItem('classroom_role_prefs') || '{}');
          var theme = p.theme || 'system';
          var dark = theme === 'dark' || (theme === 'system' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches);
          var root = document.documentElement;
          root.classList.add(dark ? 'dark' : 'light');
          root.setAttribute('data-accent', p.accent || 'indigo');
          root.style.setProperty('--ui-scale', String(p.fontScale || 1));
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body class="bg-base text-ink min-h-screen font-sans selection:bg-accent-soft selection:text-white antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
